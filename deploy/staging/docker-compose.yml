# OpenCRE staging — dedicated Compose stack (not my-agents runtime).
#   cd deploy/staging && cp .env.example .env   # fill secrets + TUNNEL_TOKEN
#   docker compose up -d --build
# Cloudflare tunnel ingress: staging.opencre.org → http://127.0.0.1:5001

name: opencre-staging

# Promoted Module C stack (docs/oie/feature-flags.md) — web + workers inherit.
x-librarian-promoted: &librarian_promoted
  CRE_LIBRARIAN_DEVICE: cpu
  CRE_LIBRARIAN_CRE_SUMMARY: "1"
  CRE_LIBRARIAN_MARGIN_GAMMA: "0.85"
  CRE_LIBRARIAN_RETRIEVER_BACKEND: pgvector
  CRE_LIBRARIAN_SAFETY_GUARD: "1"
  CRE_LIBRARIAN_EMBED_BATCH: "8"
  CRE_LIBRARIAN_SHORTLIST_JUDGE: "1"
  CRE_LIBRARIAN_SHORTLIST_JUDGE_MAX_PICKS: "3"
  CRE_LIBRARIAN_LEAF_DRILLDOWN: "1"
  CRE_LIBRARIAN_LEAF_DRILLDOWN_MIN_SECTIONS: "20"
  CRE_LIBRARIAN_LEAF_DRILLDOWN_MIN_CHILDREN: "3"
  CRE_LIBRARIAN_LEAF_DRILLDOWN_KEEP_HUB: "0"
  CRE_LIBRARIAN_LEAF_DRILLDOWN_HUB_FIRST: "0"
  CRE_LIBRARIAN_UMBRELLA_PROMOTE_CAP: "8"
  NO_LOAD_GRAPH_DB: "1"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cre_staging_change_me}
      POSTGRES_DB: cre
    volumes:
      - opencre_staging_pg:/var/lib/postgresql/data
    networks:
      - opencre_staging_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cre -d cre"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis/redis-stack:latest
    volumes:
      - opencre_staging_redis:/data
    networks:
      - opencre_staging_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Gap-analysis / graph explore (Module C uses Postgres+pgvector, not Neo4j).
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - opencre_staging_neo4j:/data
    networks:
      - opencre_staging_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$$(echo $$NEO4J_AUTH | cut -d/ -f2)\" 'RETURN 1' >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 45s
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements-dev.txt
    env_file:
      - .env
    environment:
      FLASK_CONFIG: production
      INSECURE_REQUESTS: "1"
      # Prefer DATABASE_URL only — bare SQLALCHEMY_DATABASE_URI skips psycopg2 pinning.
      DATABASE_URL: postgresql://cre:${POSTGRES_PASSWORD:-cre_staging_change_me}@db:5432/cre
      DEV_DATABASE_URL: postgresql://cre:${POSTGRES_PASSWORD:-cre_staging_change_me}@db:5432/cre
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_NO_SSL: "true"
      NEO4J_URL: bolt://neo4j:${NEO4J_PASSWORD:-password}@neo4j:7687
      CRE_SKIP_UPSTREAM_SYNC: ${CRE_SKIP_UPSTREAM_SYNC:-1}
      CRE_EMBED_EXPECTED_DIM: ${CRE_EMBED_EXPECTED_DIM:-3072}
      GUNICORN_BIND: "0.0.0.0:5001"
      <<: *librarian_promoted
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - opencre_staging_secrets:/code/.secrets
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - opencre_staging_net
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements-dev.txt
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        export FLASK_APP=/code/cre.py
        export FLASK_CONFIG=production
        export INSECURE_REQUESTS=1
        exec python /code/cre.py --start_worker
    env_file:
      - .env
    environment:
      FLASK_CONFIG: production
      INSECURE_REQUESTS: "1"
      DATABASE_URL: postgresql://cre:${POSTGRES_PASSWORD:-cre_staging_change_me}@db:5432/cre
      DEV_DATABASE_URL: postgresql://cre:${POSTGRES_PASSWORD:-cre_staging_change_me}@db:5432/cre
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_NO_SSL: "true"
      NEO4J_URL: bolt://neo4j:${NEO4J_PASSWORD:-password}@neo4j:7687
      CRE_WORKER_QUEUES: oie,default
      CRE_EMBED_EXPECTED_DIM: ${CRE_EMBED_EXPECTED_DIM:-3072}
      <<: *librarian_promoted
    volumes:
      - opencre_staging_secrets:/code/.secrets
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - opencre_staging_net
    restart: unless-stopped
    # Prefer: docker compose up -d --scale worker=10 worker

  # Linux homeserver: host network reaches published 127.0.0.1:5001.
  # On Docker Desktop/Colima, prefer: cloudflared tunnel run --token "$TUNNEL_TOKEN" on the host.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    network_mode: host
    restart: unless-stopped
    depends_on:
      - web

volumes:
  opencre_staging_pg:
  opencre_staging_redis:
  opencre_staging_neo4j:
  opencre_staging_secrets:

networks:
  opencre_staging_net:
    driver: bridge
